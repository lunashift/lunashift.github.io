<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Slides</title>
<script>
// Helper for posting Luna Shift carousels to TikTok Studio: sends this post's slides to the TikTok tab that opened it.
(async()=>{const q=new URLSearchParams(location.search),id=q.get('id');
if(!/^\d{4}-\d{2}-\d{2}_p\d$/.test(id||''))return;
const files=[];for(let i=1;i<=35;i++){const n=String(i).padStart(2,'0');
const r=await fetch(`./${id}/slide_${n}.jpg?v=${Date.now()}`);if(!r.ok)break;files.push({name:`slide_${n}.jpg`,buf:await r.arrayBuffer()});}
const t=window.opener||(window.parent!==window?window.parent:null);if(t)t.postMessage({lunaSlides:files,id},'https://www.tiktok.com');
document.body.textContent=files.length+' slides sent';if(window.opener)setTimeout(()=>window.close(),1500);})();
</script>
